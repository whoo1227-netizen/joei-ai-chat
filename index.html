<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>喬薏娛樂 | AI 高情商回覆產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ffafbd;
            --soft-pink: #fff5f7;
            --border-pink: #ffcad4;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--soft-pink);
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid var(--border-pink);
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.3);
            border-radius: 24px;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%);
            transition: all 0.3s ease;
        }
        .btn-gradient:active {
            transform: scale(0.96);
            filter: brightness(0.9);
        }
        .reply-item {
            animation: fadeIn 0.4s ease-out forwards;
            opacity: 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .dot-flashing {
            position: relative;
            width: 10px;
            height: 10px;
            border-radius: 5px;
            background-color: #ffafbd;
            animation: dot-flashing 1s infinite linear alternate;
        }
        @keyframes dot-flashing {
            0% { background-color: #ffafbd; }
            50%, 100% { background-color: #ebe6ff; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- Header Area -->
    <header class="w-full max-w-md text-center mb-6 mt-2">
        <div class="inline-block p-2 bg-white rounded-full shadow-sm mb-3">
            <span class="text-2xl">🔥</span>
        </div>
        <h1 class="text-2xl font-bold text-pink-600 tracking-wider">喬薏 AI 聊天導師</h1>
        <p class="text-pink-400 text-xs mt-1 uppercase tracking-widest font-medium">JOEI AI Intelligence v4.0 Ultimate</p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md glass-card p-6 shadow-2xl relative">
        <div class="mb-4">
            <label class="block text-pink-600 font-bold text-sm mb-2 ml-1">💌 貼上男方訊息：</label>
            <textarea id="userInput" rows="3" class="w-full p-4 border-2 border-pink-50 rounded-2xl focus:outline-none focus:border-pink-200 transition-all text-gray-700 bg-pink-50/30 text-sm" placeholder="輸入訊息，讓 AI 幫妳接話..."></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-5">
            <select id="persona" class="w-full p-3 border border-pink-100 rounded-xl text-gray-600 text-sm bg-white shadow-sm appearance-none cursor-pointer">
                <option value="sweet">🍬 甜美可愛</option>
                <option value="mature">🍷 成熟御姐</option>
                <option value="humor">🎨 幽默大方</option>
                <option value="cool">❄️ 氣質高冷</option>
            </select>
            <select id="scene" class="w-full p-3 border border-pink-100 rounded-xl text-gray-600 text-sm bg-white shadow-sm appearance-none cursor-pointer">
                <option value="breakIce">初次破冰</option>
                <option value="hot">曖昧升溫</option>
                <option value="comfort">情緒安慰</option>
                <option value="decline">委婉拒絕</option>
            </select>
        </div>

        <button id="generateBtn" onclick="handleGenerate()" class="w-full btn-gradient text-white font-bold py-4 rounded-2xl mb-6 shadow-md text-lg">✨ AI 生成靈感回覆</button>

        <!-- Loading State -->
        <div id="loadingArea" class="hidden flex flex-col items-center py-8">
            <div class="dot-flashing"></div>
            <p class="text-pink-400 text-xs mt-6">正在通靈對方的想法...</p>
        </div>

        <!-- Result List -->
        <div id="resultContainer" class="hidden">
            <label class="text-pink-600 font-bold text-sm ml-1 mb-2 block">💡 專屬建議 (點擊即可複製)：</label>
            <div id="replyList" class="space-y-3 max-h-[400px] overflow-y-auto pr-1"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto py-8 text-center w-full">
        <p class="text-pink-300 text-[10px] tracking-widest">版權歸喬薏娛樂有限公司所有<br>JOEI ENTERTAINMENT CO., LTD.<br>翻印 (盜拷) 必究 © 2026</p>
    </footer>

    <!-- Toast Component -->
    <div id="toast" class="fixed bottom-12 bg-black/70 text-white px-6 py-2 rounded-full text-xs opacity-0 transition-opacity z-50 pointer-events-none"></div>

    <script>
        // 設定 API Key (空字串將由環境自動注入)
        const apiKey = ""; 

        async function handleGenerate() {
            const userInput = document.getElementById('userInput').value.trim();
            const personaSelect = document.getElementById('persona');
            const persona = personaSelect.options[personaSelect.selectedIndex].text;
            const sceneSelect = document.getElementById('scene');
            const scene = sceneSelect.options[sceneSelect.selectedIndex].text;

            if (!userInput) return showToast("請先輸入對方的訊息內容喔！");

            toggleLoading(true);

            // 指數退避重試邏輯 (最多重試 5 次)
            const maxRetries = 5;
            let currentRetry = 0;
            let success = false;

            while (currentRetry < maxRetries && !success) {
                try {
                    const model = "gemini-2.5-flash-preview-09-2025";
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                    
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ 
                                parts: [{ 
                                    text: `妳是一位戀愛導師。人設「${persona}」，場景「${scene}」。對方說：「${userInput}」。請給我5條回覆。格式要求：純 JSON 陣列，例如 ["回覆1", "回覆2", "回覆3", "回覆4", "回覆5"]。不要解釋。`
                                }] 
                            }]
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || "網路連線失敗");
                    }

                    const data = await response.json();
                    const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (rawText) {
                        const replies = parseAiResponse(rawText);
                        displayReplies(replies);
                        success = true;
                    } else {
                        throw new Error("模型返回了空結果");
                    }

                } catch (err) {
                    currentRetry++;
                    if (currentRetry >= maxRetries) {
                        console.error("所有重試均失敗:", err);
                        showToast("❌ 訊號異常，請檢查網路後再試一次");
                    } else {
                        // 等待時間: 1s, 2s, 4s, 8s...
                        const delay = Math.pow(2, currentRetry - 1) * 1000;
                        await new Promise(res => setTimeout(res, delay));
                    }
                }
            }
            
            toggleLoading(false);
        }

        function parseAiResponse(text) {
            try {
                const match = text.match(/\[.*\]/s);
                if (match) return JSON.parse(match[0]);
            } catch (e) {}
            // 備選分割邏輯
            return text.split('\n').filter(s => s.trim().length > 3).slice(0, 5);
        }

        function displayReplies(replies) {
            const list = document.getElementById('replyList');
            const container = document.getElementById('resultContainer');
            container.classList.remove('hidden');
            list.innerHTML = '';
            
            replies.forEach((text, index) => {
                const cleanText = text.replace(/^[\d\.\s"']+|["']+$/g, '').trim(); 
                const div = document.createElement('div');
                div.className = "reply-item bg-white p-4 rounded-xl border border-pink-100 mb-2 text-sm text-gray-700 shadow-sm cursor-pointer active:bg-pink-50 hover:border-pink-300 transition-all";
                div.style.animationDelay = `${index * 0.1}s`;
                div.innerText = cleanText;
                div.onclick = () => {
                    const el = document.createElement('textarea');
                    el.value = cleanText;
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                    showToast("已複製靈感回覆 ✨");
                };
                list.appendChild(div);
            });
            container.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        function toggleLoading(load) {
            document.getElementById('generateBtn').classList.toggle('hidden', load);
            document.getElementById('loadingArea').classList.toggle('hidden', !load);
        }

        function showToast(m) {
            const t = document.getElementById('toast');
            t.innerText = m;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2500);
        }
    </script>
</body>
</html>
