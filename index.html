        function getStaticReply() {
            const persona = document.getElementById('persona').value;
            const scene = document.getElementById('scene').value;
            
            toggleLoading(true);

            setTimeout(() => {
                const replies = REPLY_DATABASE[persona][scene];
                if(!replies) {
                     displayReplies(["這個風格暫時沒有對應場景喔 😅"]);
                } else {
                     displayReplies(replies);
                }
                toggleLoading(false);
            }, 600);
        }

        function displayReplies(replies) {
            const list = document.getElementById('replyList');
            const container = document.getElementById('resultContainer');
            container.classList.remove('hidden');
            list.innerHTML = '';
            
            replies.forEach((text, index) => {
                const div = document.createElement('div');
                div.className = "reply-item bg-white p-4 rounded-xl border border-pink-100 mb-2 text-sm text-gray-700 shadow-sm cursor-pointer active:bg-pink-50 hover:border-pink-300 transition-all";
                div.style.animationDelay = `${index * 0.05}s`;
                div.innerText = text;
                div.onclick = () => {
                    const el = document.createElement('textarea');
                    el.value = text;
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                    showToast("已複製靈感 ✨");
                };
                list.appendChild(div);
            });
            container.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        function toggleLoading(load) {
            document.getElementById('generateBtn').classList.toggle('hidden', load);
            const list = document.getElementById('replyList');
            if(load) list.innerHTML = '<div class="text-center py-10 text-pink-300 text-xs animate-pulse">正在通靈靈感中...</div>';
        }

        function showToast(m) {
            const t = document.getElementById('toast');
            t.innerText = m;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2500);
        }
    </script>
</body>
